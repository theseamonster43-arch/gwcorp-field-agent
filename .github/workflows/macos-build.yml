# Builds the macOS app on GitHub's Apple hardware.
#
# Exists because macOS builds need macOS — Xcode, codesign and the .app bundle
# format have no Windows equivalent. The dev machine is a PC, so this is the
# only way to produce a Mac build without buying one.
#
# Produces the zip that download.html serves to Mac visitors.
name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/macos-build.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not 'latest stable'. A newer analyzer can promote an info
          # to a warning and fail a build that passes on the dev machine —
          # which is exactly what happened on the first macOS run.
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      # No Developer ID: that needs a paid Apple account and certificates in
      # secrets. Gatekeeper therefore asks the user to right-click → Open the
      # first time, which download.html explains.
      - run: flutter build macos --release

      # Ad-hoc signature. Not a Developer ID, but macOS refuses keychain access
      # to a completely unsigned binary — which is why Firebase Auth failed
      # with "An error occurred when accessing the keychain" even after the
      # sandbox came off. `-` is the ad-hoc identity; it needs no certificate.
      - name: Ad-hoc sign
        run: |
          cd build/macos/Build/Products/Release
          APP="GWCORP Field Agent.app"

          # Nested code first, outermost last. --deep is discouraged by Apple
          # and can leave a bundle that verifies as damaged, which macOS then
          # treats as unsigned — no keychain, so Firebase Auth fails exactly
          # as it did when the app carried no signature at all.
          find "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -perm +111 \) -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do codesign --force --sign - "$f" || true; done
          for fw in "$APP/Contents/Frameworks/"*.framework; do
            [ -e "$fw" ] && codesign --force --sign - "$fw" || true
          done

          # --force replaces the signature and drops whatever entitlements the
          # build applied, so they have to be handed back explicitly.
          codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/macos/Runner/Release.entitlements" \
            "$APP"

          echo "--- verify ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- entitlements actually on the bundle ---"
          codesign --display --entitlements :- "$APP"

      # A .dmg, because that is what a Mac user expects to double-click: it
      # mounts, shows the app beside an Applications shortcut, and makes
      # "drag it in" obvious without instructions.
      - name: Build the DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg-staging
          cp -R "GWCORP Field Agent.app" dmg-staging/
          # The symlink is what turns the window into a drag-to-install.
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "GWCORP Field Agent" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/GWCORP_Field_Agent_macOS.dmg"
          ls -lh "$GITHUB_WORKSPACE/GWCORP_Field_Agent_macOS.dmg"

      # Also a zip: some people would rather not mount an image, and `ditto`
      # preserves the symlinks and resource forks inside the .app that a plain
      # zip corrupts — the copy then refuses to launch with no useful error.
      - name: Package a zip as well
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "GWCORP Field Agent.app" \
            "$GITHUB_WORKSPACE/GWCORP_Field_Agent_macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gwcorp-field-agent-macos
          path: |
            GWCORP_Field_Agent_macOS.dmg
            GWCORP_Field_Agent_macOS.zip
          retention-days: 30
