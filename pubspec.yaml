name: gwcorp_field_agent
description: GWCORP Field Agent — waste intelligence platform.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Navigation
  go_router: ^14.3.0

  # Camera & images
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0

  # Network
  http: ^1.2.2

  # WebView
  webview_flutter: ^4.10.0

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  window_manager: ^0.4.3
  url_launcher: ^6.3.2

  # Satellite / disposal finder
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Desktop map: google_maps_flutter has no Windows support, so Windows renders
  # the map in a WebView pointed at the hosted /map page.
  webview_windows: ^0.4.0

  # Desktop cannot navigate while driving — Start shows a QR that hands the
  # destination to the phone instead.
  qr_flutter: ^4.1.0

  # Receives the gwcorp:// handoff the desktop QR points at.
  app_links: ^6.3.2

  # Reads the running build number so the updater can compare against the
  # published manifest.
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icons are generated from the desktop diamond so every platform
# shows the same mark. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  # The App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
  min_sdk_android: 21
